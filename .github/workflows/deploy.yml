# Builds the site and publishes it to GitHub Pages on every push to main, and every three hours
# so the download page lists the newest release of the app (read from GitHub at build time).
# Set the repository variable CUSTOM_DOMAIN (e.g. whooshdownloadmanager.app)
# once the domain's DNS points at GitHub Pages; until then the site is served
# at https://coderzonebd.github.io/wdm/.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The install script, served by the site
        # One file is both a shell and a PowerShell script (packaging/install/install in the app's
        # repository); as .txt GitHub Pages serves it as text/plain, which curl and irm both take.
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/coderzonebd/whoosh-download-manager/pub/packaging/install/install -o public/install.txt
      - run: pnpm check
      - run: pnpm build
        env:
          # The download page reads the app's releases; a token lifts the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
